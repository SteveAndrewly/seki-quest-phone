plugins {
    id 'com.android.application'
}

// Each GitHub build gets the next version number, so a new APK always installs over the old one.
def buildNumber = (System.getenv('GITHUB_RUN_NUMBER') ?: '1') as int
// The signing key comes from the repository's secrets (see .github/workflows/build.yml), never from the files here.
def keyFile = System.getenv('SIGNING_KEY_FILE')

android {
    namespace 'com.sekiquest.phone'
    compileSdk 35

    defaultConfig {
        applicationId 'com.sekiquest.phone'
        minSdk 24
        targetSdk 35
        versionCode buildNumber
        versionName "1.0.${buildNumber}"
    }

    signingConfigs {
        release {
            if (keyFile) {
                storeFile file(keyFile)
                storeType 'pkcs12'
                storePassword System.getenv('SIGNING_PASSWORD')
                keyAlias 'sekiquest'
                keyPassword System.getenv('SIGNING_PASSWORD')
            }
        }
    }

    buildTypes {
        release {
            minifyEnabled false
            signingConfig keyFile ? signingConfigs.release : signingConfigs.debug
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }

    lint {
        abortOnError false
        checkReleaseBuilds false
    }
}

dependencies {
    // Google's code scanner: Google Play services shows the camera, so the app needs no camera permission.
    implementation 'com.google.android.gms:play-services-code-scanner:16.1.0'
}
